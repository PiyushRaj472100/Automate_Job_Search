services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: pjip, POSTGRES_PASSWORD: pjip, POSTGRES_DB: pjip}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pjip:pjip@db:5432/pjip
    depends_on: [db]
    ports: ["8001:8001"]
volumes:
  pgdata:
